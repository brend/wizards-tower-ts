<!doctype html>
<html lang="en">
<head><base href="../"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wizard's Tower · Playtest</title><link rel="stylesheet" href="style.css">
<style>body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1020; } canvas {display:block;max-width:100%;height:auto!important;} #fixtures {position:fixed;bottom:0;right:0;z-index:10;background:#111c;max-width:100%;} #fixtures button {font-size:11px;padding:5px;}</style></head>
<body>
<script type="module">
// Development-only entry point. Uses the real app markup and real scene; Vite's
// production build only includes index.html. These controls never ship in dist/.
const markup = await (await fetch('index.html')).text();
const page = new DOMParser().parseFromString(markup, 'text/html');
document.body.prepend(page.getElementById('container'));
await import('../src/main.ts');
const { Combatant } = await import('../src/Entities.ts');
const { Timer } = await import('../src/core/Timer.ts');
const fixtures = document.createElement('div'); fixtures.id = 'fixtures';
const action = (label, callback) => { const button = document.createElement('button'); button.textContent = label; button.onclick = callback; fixtures.append(button); };
const scene = window.game.scene;
const reset = () => { window.game.start(); scene.restart(true); };
action('Fixture: upgrades', () => { reset(); scene.game.build.xp = 6; scene.game.update(1/60); });
action('Fixture: defeat', () => { reset(); scene.game.build.tower.hp = 0; scene.game.update(1/60); });
action('Fixture: encounter', () => {
  reset();
  for (const [i, kind] of ['ork','runner','gargoyle','brute'].entries()) {
    const actor = new Combatant(100+i, kind); actor.x = actor.previousX = 15 + i * 23; scene.game.enemies.push(actor);
  }
  scene.game.minions.push(new Combatant(200, 'skeleton'));
  scene.game.build.summonTimer = new Timer(8);
  scene.game.build.tower.wardUnlocked = scene.game.build.tower.wardReady = true;
});
action('Fixture: narrow', () => { document.getElementById('container').style.width = '390px'; });
action('Fixture: full width', () => { document.getElementById('container').style.width = ''; });
document.body.append(fixtures);
</script>
</body></html>
